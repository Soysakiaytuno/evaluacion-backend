version: '3.8'
services:

  db:
    image: postgres
    container_name: conferencia-db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - conferencia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis
    container_name: conferencia-cache
    networks:
      - conferencia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend_admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conferencia-admin
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - conferencia-network
    command: bash -c "python manage.py migrate && python manage.py createsuperuser --noinput || true && gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conferencia-api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - conferencia-network
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
  
  proxy:
    image: nginx:alpine
    container_name: conferencia-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_admin
      - backend_api
    networks:
      - conferencia-network

networks:
  conferencia-network:
    driver: bridge

volumes:
  pgdata: