version: '3.8'
services:

  db:
    image: postgres:16
    container_name: conferencia-db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - conferencia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis
    container_name: conferencia-cache
    networks:
      - conferencia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend_admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conferencia-admin
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - conferencia-network
    command:
      - /bin/bash
      - -c
      - |
        cd backend/admin
        python manage.py collectstatic --noinput
        python manage.py makemigrations
        python manage.py migrate
        python manage.py seed_db
        python manage.py createsuperuser --noinput || true
        exec gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conferencia-api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - conferencia-network
    command:
      - /bin/bash
      - -c
      - "uvicorn backend.api.main:app --host 0.0.0.0 --port 8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
  
  proxy:
    image: nginx:alpine
    container_name: conferencia-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/404.html:/var/www/error/404.html:ro
      - ./conference-frontend:/var/www/frontend:ro
    depends_on:
      - backend_admin
      - backend_api
    networks:
      - conferencia-network

networks:
  conferencia-network:
    driver: bridge

volumes:
  pgdata: