version: '3.8'
services:

  db:
    image: postgres
    container_name: conferencia-db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - conferencia-network
    restart: unless-stopped

  cache:
    image: redis
    container_name: conferencia-cache
    networks:
      - conferencia-network
    restart: unless-stopped

  backend_admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: conferencia-admin
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - conferencia-network
    command: python manage.py runserver 0.0.0.0:8000

  backend_api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: conferencia-api
    env_file:
      - .env
    depends_on:
      - db
      - cache
    networks:
      - conferencia-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000
  
  proxy:
    image: nginx:alpine
    container_name: conferencia-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_admin
      - backend_api
    networks:
      - conferencia-network

networks:
  conferencia-network:
    driver: bridge

volumes:
  pgdata: